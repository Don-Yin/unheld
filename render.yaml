# Render Blueprint. Set env values in the Render dashboard (see env.example).
services:
  - type: web
    name: unheld
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      # Gate: long random string required on every page and /api/* route.
      - key: ACCESS_CODE
        sync: false

      # AI provider (OpenRouter), lib/ai/provider.ts + lib/ai/guard.ts.
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODELS
        sync: false
      - key: AI_DAILY_LIMIT
        sync: false

      # PayPal sandbox REST app, lib/paypal.ts.
      - key: PAYPAL_API_BASE
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_TEST_CARD
        sync: false
      - key: PAYPAL_TEST_CARD_EXPIRY
        sync: false
      - key: PAYPAL_TEST_CARD_CVV
        sync: false

      # Gmail evidence widget, lib/gmail.ts.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_TEST_ADDRESS
        sync: false

      # Optional AG Studio licence key (trial watermark shows without it).
      - key: AG_STUDIO
        sync: false
